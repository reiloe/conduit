---
services:

  frontend:
    build:
      context: ./conduit-frontend
      dockerfile: Dockerfile
    restart: on-failure
    env_file: ".env"
    ports:
      - "${FRONTEND_PORT}:80"

  backend:
    build:
      context: ./conduit-backend
      dockerfile: Dockerfile
    restart: on-failure
    env_file: ".env"
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - backend:/app

volumes:
  backend: